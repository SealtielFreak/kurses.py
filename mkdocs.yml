site_name: kurses.py
site_url: https://sealtielfreak.github.io/kurses.py/
site_description: Python module that emulates conio and curses with SDL2/Pygame.
site_author: SealtielFreak

repo_name: SealtielFreak/kurses.py
repo_url: https://github.com/SealtielFreak/kurses.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - GitHub: https://github.com/SealtielFreak/kurses.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SealtielFreak/kurses.py

copyright: Copyright &copy; 2026 SealtielFreak
