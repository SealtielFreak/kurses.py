[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurses-py"
version = "0.1.2.0"
description = "This module simulates the ‘conio’ and ‘curses’ libraries to create text interfaces with color and cursor."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LGPL-2.1" }
authors = [
    { name = "SealtielFreak", email = "sealtielfreak@yandex.com" },
]
keywords = ["curses", "conio", "terminal", "sdl2", "text-interface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "numpy>=1.24.0,<2.0",
]

[project.optional-dependencies]
sdl2 = [
    "pysdl2",
    "pysdl2-dll",
]

[project.urls]
Homepage = "https://github.com/SealtielFreak/kurses.py"
Repository = "https://github.com/SealtielFreak/kurses.py"
Issues = "https://github.com/SealtielFreak/kurses.py/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kurses",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kurses"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py38"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B007",  # unused loop control variable
    "B023",  # function definition does not bind loop variable
    "B027",  # empty method in abstract base class without abstract decorator
    "SIM102", # nested if statements
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sdl2.*"]
ignore_missing_imports = true
