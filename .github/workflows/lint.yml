name: Lint and type check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Run ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync environment with SDL2 support
        run: uv sync --extra sdl2

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/kurses
